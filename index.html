<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=dist/src/index.html" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>منظومة إدارة الشركات والفروع</title>
    <script>
      (function() {
        var base = window.location.pathname;
        if (!base.endsWith('/')) base += '/';
        window.location.replace(base + 'dist/src/index.html');
      })();
    </script>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 50px 20px;
        direction: rtl;
        background: #f8fafc;
        color: #1e293b;
      }
      .loader {
        margin: 20px auto;
        border: 4px solid #e2e8f0;
        border-top: 4px solid #0284c7;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      a { color: #0284c7; font-weight: bold; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="loader"></div>
    <p>جارٍ تحميل التطبيق...</p>
    <p><a href="dist/src/index.html">اضغط هنا إذا لم يتم التحويل تلقائياً</a></p>
  </body>
</html>
